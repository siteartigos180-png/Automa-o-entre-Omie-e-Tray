name: Sincronizar Produtos Omie para Tray

# Produtos do Omie ativos e marcados para marketplace/e-commerce -> Tray.
# - A cada 5 minutos: modo incremental (cada execução fica ~4,5 min rodando
#   um ciclo por minuto com o que mudou no Omie).
# - 1x por dia: a primeira execução agendada depois das 03:00 (Brasília) roda o
#   modo completo (confere o catálogo inteiro) e grava uma marca no cache do dia.
#   Fica dentro da execução agendada de propósito: como as execuções dividem a
#   mesma fila, um "completo" esperando na fila seria descartado pelo GitHub
#   quando chegasse o próximo agendamento de 5 min.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "incremental (alterados recentemente) ou completo (catálogo todo)"
        default: incremental
        type: choice
        options: [incremental, completo]
      dry_run:
        description: "Simulação (não grava nada na Tray)"
        default: false
        type: boolean

# Nunca duas sincronizações ao mesmo tempo; a próxima espera a atual terminar.
concurrency:
  group: sync-omie-tray
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Data de hoje (Brasília)
        id: hoje
        run: |
          echo "dia=$(TZ=America/Sao_Paulo date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "hora=$(TZ=America/Sao_Paulo date +%-H)" >> "$GITHUB_OUTPUT"

      - name: Completo de hoje já rodou?
        id: marca
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .completo-feito
          key: completo-${{ steps.hoje.outputs.dia }}
          lookup-only: true

      - name: Escolher modo
        id: modo
        run: |
          if [ -n "${{ inputs.modo }}" ]; then
            echo "modo=${{ inputs.modo }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.hoje.outputs.hora }}" -ge 3 ] && [ "${{ steps.marca.outputs.cache-hit }}" != "true" ]; then
            echo "modo=completo" >> "$GITHUB_OUTPUT"
          else
            echo "modo=incremental" >> "$GITHUB_OUTPUT"
          fi

      - name: Sincronizar
        env:
          CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
          CODE_TRAY: ${{ secrets.CODE_TRAY }}
          APP_KEY_OMIE: ${{ secrets.APP_KEY_OMIE }}
          APP_SECRET_OMIE: ${{ secrets.APP_SECRET_OMIE }}
          TRAY_URL: https://www.artigos180cosmeticos.com.br/web_api
          MODO: ${{ steps.modo.outputs.modo }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          DURACAO_SEG: "270"
          INTERVALO_SEG: "60"
          JANELA_MIN: "10"
        run: python sincroniza_produtos.py

      - name: Marcar completo de hoje como feito
        if: github.event_name == 'schedule' && steps.modo.outputs.modo == 'completo' && success()
        run: date > .completo-feito

      - name: Salvar marca do dia
        if: github.event_name == 'schedule' && steps.modo.outputs.modo == 'completo' && success()
        uses: actions/cache/save@v4
        with:
          path: .completo-feito
          key: completo-${{ steps.hoje.outputs.dia }}
